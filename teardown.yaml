---

- name: Remove podman sites
  hosts: podman,docker,systemd
  tasks:
  - name: Remove the namespaces
    skupper.v2.system:
      namespace: "{{ inventory_hostname }}"
      platform: "{{ skupper_platform }}"
      image: registry-proxy.engineering.redhat.com/rh-osbs/service-interconnect-cli-rhel9:2.1.1-1
      action: stop
    register: teardown_results
    environment:
      SKUPPER_ROUTER_IMAGE: "{{ router_image }}"

- name: Remove workloads on Docker
  hosts: docker
  roles:
  - rm_docker_workload

- name: Remove workloads on Podman
  hosts: podman,systemd
  roles:
  - rm_podman_workload
