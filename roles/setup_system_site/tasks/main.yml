---

- name: Create the site resource
  skupper.v2.resource:
    namespace: "{{ inventory_hostname }}"
    platform: "{{ skupper_platform }}"
    def:
      apiVersion: skupper.io/v2alpha1
      kind: Site
      metadata:
        name: "{{ inventory_hostname }}"
        namespace: "{{ inventory_hostname }}"
      spec: "{{ site_spec | default(omit) }} "

- name: Create the topology resources
  skupper.v2.resource:
    namespace: "{{ inventory_hostname }}"
    platform: "{{ skupper_platform }}"
    def: "{{ item }}"
  loop: "{{ site_resources | default ([]) }}"

- name: Create the application resources
  skupper.v2.resource:
    namespace: "{{ inventory_hostname }}"
    platform: "{{ skupper_platform }}"
    def: "{{ item }}"
  loop: "{{ application_resources | default ([]) }}"

- name: Show the application resources
  ansible.builtin.debug:
    var: application_resources

- name: Setup the site
  skupper.v2.system:
    namespace: "{{ inventory_hostname }}"
    platform: "{{ skupper_platform }}"
    image: "{{ cli_image }}"
  register: system_results
  environment:
    SKUPPER_ROUTER_IMAGE: "{{ router_image | default (omit) }}"

- name: Show results
  ansible.builtin.debug:
    var: system_results
    verbosity: 1
  when: system_results is defined
